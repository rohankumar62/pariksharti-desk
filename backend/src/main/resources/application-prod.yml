spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 60000
      connection-timeout: 30000
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
app:
  require-invite: true
